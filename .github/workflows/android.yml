name: Android app

# Builds the Android app and tries it on an emulator. The apk it keeps is a
# test build signed with a throwaway key: fine for trying out, not for release.
on:
  push:
    paths: ['android/**', 'src/**', 'index.html', 'styles.css', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Logic tests
        run: npm test
      - name: Build and lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: dormice-android-test-build
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Try it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/ci/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screens
          path: android/shots/
