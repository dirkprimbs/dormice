name: Play bundle

# Builds the app bundle (.aab) for Google Play, signed with the upload key.
# Runs on a version tag (v1.2.3) and by hand. The bundle is kept as a build
# artifact; uploading it to Play Console is done by hand.
#
# Needs two repository secrets:
#   DORMICE_UPLOAD_KEYSTORE_B64  the upload keystore (.jks), base64-encoded
#   DORMICE_UPLOAD_PASSWORD      its password (keystore and key share it)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Logic tests
        run: npm test
      - name: Unpack the upload key
        env:
          KEYSTORE_B64: ${{ secrets.DORMICE_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "The DORMICE_UPLOAD_KEYSTORE_B64 secret is missing."; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build the signed bundle
        working-directory: android
        env:
          DORMICE_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          DORMICE_UPLOAD_PASSWORD: ${{ secrets.DORMICE_UPLOAD_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease
      - name: Check the signature
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | tail -1
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256:" | head -2
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: dormice-play-bundle
          if-no-files-found: error
          path: android/app/build/outputs/bundle/release/app-release.aab
